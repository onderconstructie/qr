<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR — Plak, scan, klaar</title>

  <!-- Strak, origineel icoon (QR in cirkel) -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f0fdf4' stroke='%2310b981' stroke-width='2'/%3E%3Cg fill='%2310b981'%3E%3Crect x='8' y='8' width='6' height='6' rx='1'/%3E%3Crect x='18' y='8' width='6' height='6' rx='1'/%3E%3Crect x='8' y='18' width='6' height='6' rx='1'/%3E%3Crect x='16' y='16' width='2' height='2'/%3E%3Crect x='20' y='16' width='2' height='2'/%3E%3Crect x='16' y='20' width='2' height='2'/%3E%3Crect x='22' y='20' width='2' height='2'/%3E%3Crect x='18' y='22' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E"/>

  <style>
    :root {
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;

      --green-50: #f0fdf4;
      --green-100: #dcfce7;
      --green-500: #22c55e;
      --green-600: #16a34a;

      --accent: #10b981;
      --accent-light: #d1fae5;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--slate-50);
      color:var(--slate-700);
      line-height:1.5;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    .header{
      background:var(--white);
      border-bottom:1px solid var(--slate-200);
      padding:1.25rem 2rem;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .back-link{
      position:absolute;
      left:2rem;
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      font-size:.875rem;
      color:var(--slate-400);
      text-decoration:none;
      transition:color .2s;
    }
    .back-link:hover{ color:var(--accent); }
    .back-link svg{ width:16px; height:16px; }

    .header-content{
      display:flex;
      align-items:center;
      gap:1rem;
    }
    .logo{ width:44px; height:44px; flex-shrink:0; }
    .header-text h1{
      font-size:1.25rem;
      font-weight:700;
      color:var(--slate-800);
      letter-spacing:-0.02em;
    }
    .header-text p{
      font-size:.8125rem;
      color:var(--slate-500);
    }

    @media (max-width:900px){
      .header{ flex-direction:column; padding:1rem 1.5rem; }
      .back-link{ position:static; margin-bottom:.75rem; }
    }

    .container{
      max-width:1000px;
      margin:0 auto;
      padding:1.5rem 2rem;
    }

    .main-grid{
      display:grid;
      grid-template-columns: 1fr 380px;
      gap:2rem;
      align-items:stretch;
    }
    @media (max-width:900px){
      .main-grid{ grid-template-columns:1fr; }
    }

    .card{
      background:var(--white);
      border-radius:var(--radius-lg);
      border:1.5px solid var(--slate-200);
      padding:1.5rem;
      display:flex;
      flex-direction:column;
    }

    .card-title{
      font-size:0.6875rem;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.1em;
      color:var(--slate-400);
      margin-bottom:1.25rem;
    }

    .urlbar{
      display:flex;
      gap:.75rem;
      align-items:center;
      border:1.5px solid var(--slate-200);
      background:var(--slate-50);
      border-radius:999px;
      padding:.5rem .6rem;
      transition:border-color .2s, box-shadow .2s;
    }
    .urlbar:focus-within{
      border-color: rgba(16,185,129,.55);
      box-shadow: 0 0 0 4px rgba(16,185,129,.12);
      background:var(--white);
    }
    .urlbar svg{ width:18px; height:18px; color:var(--accent); flex:0 0 auto; }
    .urlbar input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-size:.95rem;
      color:var(--slate-800);
      padding:.35rem .25rem;
    }

    .actions{
      display:flex;
      gap:.75rem;
      margin-top:1rem;
      flex-wrap:wrap;
    }
    button{
      appearance:none;
      border:1.5px solid var(--slate-200);
      background:var(--white);
      color:var(--slate-700);
      padding:.55rem .9rem;
      border-radius:999px;
      cursor:pointer;
      font-weight:600;
      font-size:.875rem;
      transition:transform .05s, border-color .2s, background .2s, color .2s;
      display:inline-flex;
      align-items:center;
      gap:.5rem;
    }
    button:hover{ border-color: rgba(16,185,129,.5); color:var(--slate-800); }
    button:active{ transform: translateY(1px); }
    button.primary{
      background:var(--green-50);
      border-color: rgba(16,185,129,.45);
      color: var(--green-600);
    }
    button:disabled{ opacity:.5; cursor:not-allowed; }

    .btn-icon{
      width:16px;
      height:16px;
      flex:0 0 auto;
    }

    .preview-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-grow:1;
      padding:1rem;
      border-radius:var(--radius-lg);
      border:1.5px solid var(--slate-100);
      background:var(--white);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.03);
    }
    canvas{ image-rendering: pixelated; }

    /* Footer quote: niet cursief, niet vet */
    .footer{
      text-align:center;
      padding:2rem;
      color:var(--accent);
      font-size:0.8125rem;
      font-style:normal;
      font-weight:400; /* <- niet vet */
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="https://onderconstructie.github.io/projectmanagement/" class="back-link" aria-label="Terug naar Projectmanagement">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Projectmanagement
    </a>

    <div class="header-content">
      <div class="logo" aria-hidden="true">
        <!-- Logo (ook hergebruikt voor download-knop) -->
        <svg id="appLogo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
          <g fill="#10b981">
            <rect x="12" y="12" width="7" height="7" rx="1.4"/>
            <rect x="21" y="12" width="7" height="7" rx="1.4"/>
            <rect x="12" y="21" width="7" height="7" rx="1.4"/>
            <rect x="21" y="21" width="2.4" height="2.4" rx=".4"/>
            <rect x="24.4" y="21" width="2.4" height="2.4" rx=".4"/>
            <rect x="21" y="24.4" width="2.4" height="2.4" rx=".4"/>
            <rect x="26.8" y="24.4" width="2.4" height="2.4" rx=".4"/>
            <rect x="23.4" y="26.8" width="2.4" height="2.4" rx=".4"/>
          </g>
          <g stroke="#10b981" stroke-width="0.75" opacity="0.22">
            <line x1="12" y1="20" x2="28" y2="20"/>
            <line x1="20" y1="12" x2="20" y2="28"/>
          </g>
        </svg>
      </div>

      <div class="header-text">
        <h1>QR Generator</h1>
        <p>Plak, scan, klaar</p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="main-grid">
      <section class="card" aria-labelledby="inputTitle">
        <h2 class="card-title" id="inputTitle">URL</h2>

        <div class="urlbar" role="group" aria-label="URL invoer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 1 0-7l1-1a5 5 0 0 1 7 7l-1 1"/>
            <path d="M14 11a5 5 0 0 1 0 7l-1 1a5 5 0 0 1-7-7l1-1"/>
          </svg>
          <input id="data" type="text" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="Plak of schrijf een URL…" aria-label="URL"/>
        </div>

        <div class="actions">
          <button id="download" class="primary" disabled>
            <!-- download icoon = logo -->
            <svg class="btn-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="20" cy="20" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
              <g fill="#10b981">
                <rect x="12" y="12" width="7" height="7" rx="1.4"/>
                <rect x="21" y="12" width="7" height="7" rx="1.4"/>
                <rect x="12" y="21" width="7" height="7" rx="1.4"/>
                <rect x="21" y="21" width="2.4" height="2.4" rx=".4"/>
                <rect x="24.4" y="21" width="2.4" height="2.4" rx=".4"/>
                <rect x="21" y="24.4" width="2.4" height="2.4" rx=".4"/>
                <rect x="26.8" y="24.4" width="2.4" height="2.4" rx=".4"/>
                <rect x="23.4" y="26.8" width="2.4" height="2.4" rx=".4"/>
              </g>
            </svg>
            Download PNG
          </button>

          <button id="clear" disabled>Wis</button>
        </div>
      </section>

      <aside class="card" aria-labelledby="previewTitle">
        <h2 class="card-title" id="previewTitle">QR</h2>
        <div class="preview-wrap">
          <canvas id="qr" width="320" height="320" aria-label="QR code"></canvas>
        </div>
      </aside>
    </div>
  </div>

  <footer class="footer">Zie de dingen zoals ze zijn; het oordeel komt later.</footer>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <script>
    const input = document.getElementById("data");
    const canvas = document.getElementById("qr");
    const ctx = canvas.getContext("2d", { alpha: false });

    const btnDl = document.getElementById("download");
    const btnClear = document.getElementById("clear");

    // Geen groottekeuze: vaste output.
    const OUTPUT_PX = 320;
    const MARGIN_MODULES = 2;
    const EC_LEVEL = "M";

    // Groenige QR (accent), wit background
    const FG = "#10b981";
    const BG = "#ffffff";

    function renderBlank() {
      canvas.width = OUTPUT_PX;
      canvas.height = OUTPUT_PX;
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, OUTPUT_PX, OUTPUT_PX);

      btnDl.disabled = true;
      btnClear.disabled = true;
    }

    function normalize(s) {
      return (s || "").trim().replace(/\s+/g, " ");
    }

    function drawQr(data) {
      const value = normalize(data);
      if (!value) { renderBlank(); return; }

      const qr = qrcode(0, EC_LEVEL);
      qr.addData(value);
      qr.make();

      const moduleCount = qr.getModuleCount();
      const totalModules = moduleCount + (MARGIN_MODULES * 2);

      const scale = Math.floor(OUTPUT_PX / totalModules);
      const realSize = scale * totalModules;

      canvas.width = realSize;
      canvas.height = realSize;

      ctx.imageSmoothingEnabled = false;

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, realSize, realSize);

      ctx.fillStyle = FG;
      for (let r = 0; r < moduleCount; r++) {
        for (let c = 0; c < moduleCount; c++) {
          if (qr.isDark(r, c)) {
            const x = (c + MARGIN_MODULES) * scale;
            const y = (r + MARGIN_MODULES) * scale;
            ctx.fillRect(x, y, scale, scale);
          }
        }
      }

      btnDl.disabled = false;
      btnClear.disabled = false;
    }

    function downloadPng() {
      const a = document.createElement("a");
      const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
      a.download = `qr-${ts}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    function clearAll() {
      input.value = "";
      renderBlank();
      input.focus();
    }

    let t;
    function debounce(fn, ms=150) {
      clearTimeout(t);
      t = setTimeout(fn, ms);
    }

    input.addEventListener("input", () => debounce(() => drawQr(input.value)));
    btnDl.addEventListener("click", downloadPng);
    btnClear.addEventListener("click", clearAll);

    renderBlank();
  </script>
</body>
</html>
