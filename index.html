<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR — Plak, scan, klaar</title>

  <!-- App favicon: hetzelfde logo als in de header -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='16' fill='%23f0fdf4' stroke='%2310b981' stroke-width='2'/%3E%3Cg fill='%2310b981'%3E%3Crect x='12' y='12' width='7' height='7' rx='1.4'/%3E%3Crect x='21' y='12' width='7' height='7' rx='1.4'/%3E%3Crect x='12' y='21' width='7' height='7' rx='1.4'/%3E%3Crect x='21' y='21' width='2.4' height='2.4' rx='.4'/%3E%3Crect x='24.4' y='21' width='2.4' height='2.4' rx='.4'/%3E%3Crect x='21' y='24.4' width='2.4' height='2.4' rx='.4'/%3E%3Crect x='26.8' y='24.4' width='2.4' height='2.4' rx='.4'/%3E%3Crect x='23.4' y='26.8' width='2.4' height='2.4' rx='.4'/%3E%3C/g%3E%3C/svg%3E"/>

  <style>
    :root{
      --slate-50:#f8fafc;
      --slate-200:#e2e8f0;
      --slate-400:#94a3b8;
      --slate-500:#64748b;
      --slate-700:#334155;
      --slate-800:#1e293b;
      --slate-900:#0f172a;
      --white:#ffffff;
      --accent:#10b981;
      --accent-soft:#f0fdf4;
      --radius:16px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--slate-50);
      color:var(--slate-700);
      min-height:100vh;
    }

    header{
      background:var(--white);
      border-bottom:1px solid var(--slate-200);
      padding:1.25rem 2rem;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .back-link{
      position:absolute;
      left:2rem;
      display:flex;
      align-items:center;
      gap:.4rem;
      font-size:.85rem;
      color:var(--slate-400);
      text-decoration:none;
    }
    .back-link:hover{ color:var(--accent); }

    .header-inner{
      display:flex;
      align-items:center;
      gap:1rem;
    }

    .logo{ width:44px; height:44px; }

    h1{
      font-size:1.25rem;
      font-weight:700;
      color:var(--slate-800);
      letter-spacing:-0.02em;
    }

    .subtitle{
      font-size:.8rem;
      color:var(--slate-500);
    }

    main{
      max-width:960px;
      margin:0 auto;
      padding:2rem;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:2rem;
    }

    @media(max-width:900px){
      .layout{ grid-template-columns:1fr; }
      .back-link{ position:static; margin-bottom:.75rem; }
      header{ flex-direction:column; }
    }

    .card{
      background:var(--white);
      border:1.5px solid var(--slate-200);
      border-radius:var(--radius);
      padding:1.5rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
    }

    .label{
      font-size:.65rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--slate-400);
      font-weight:600;
    }

    .urlbar{
      display:flex;
      align-items:center;
      gap:.75rem;
      border:1.5px solid var(--slate-200);
      background:var(--slate-50);
      border-radius:999px;
      padding:.55rem .75rem;
    }

    .urlbar:focus-within{
      border-color:var(--accent);
      background:var(--white);
      box-shadow:0 0 0 4px rgba(16,185,129,.12);
    }

    .urlbar input{
      border:none;
      outline:none;
      background:transparent;
      width:100%;
      font-size:.95rem;
      color:var(--slate-900);
    }

    .actions{
      display:flex;
      gap:.75rem;
    }

    button{
      appearance:none;
      border:1.5px solid var(--slate-200);
      background:var(--white);
      border-radius:999px;
      padding:.55rem .85rem;
      font-size:.85rem;
      font-weight:600;
      color:var(--slate-700);
      display:flex;
      align-items:center;
      gap:.4rem;
      cursor:pointer;
    }

    button.primary{
      background:var(--accent-soft);
      border-color:var(--accent);
      color:#047857;
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .btn-icon{
      width:16px;
      height:16px;
      display:block;
    }

    .preview{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1.5px solid var(--slate-200);
      border-radius:var(--radius);
      background:var(--white);
    }

    canvas{ image-rendering:pixelated; }

    footer{
      text-align:center;
      padding:2rem;
      font-size:.8rem;
      color:var(--accent);
      font-weight:400;
    }
  </style>
</head>
<body>

<header>
  <a class="back-link" href="https://onderconstructie.github.io/projectmanagement/">
    ← Projectmanagement
  </a>

  <div class="header-inner">
    <!-- App-logo (identiek aan vorige versie) -->
    <div class="logo">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
        <g fill="#10b981">
          <rect x="12" y="12" width="7" height="7" rx="1.4"/>
          <rect x="21" y="12" width="7" height="7" rx="1.4"/>
          <rect x="12" y="21" width="7" height="7" rx="1.4"/>
          <rect x="21" y="21" width="2.4" height="2.4" rx=".4"/>
          <rect x="24.4" y="21" width="2.4" height="2.4" rx=".4"/>
          <rect x="21" y="24.4" width="2.4" height="2.4" rx=".4"/>
          <rect x="26.8" y="24.4" width="2.4" height="2.4" rx=".4"/>
          <rect x="23.4" y="26.8" width="2.4" height="2.4" rx=".4"/>
        </g>
      </svg>
    </div>
    <div>
      <h1>QR Generator</h1>
      <div class="subtitle">Plak, scan, klaar</div>
    </div>
  </div>
</header>

<main>
  <div class="layout">
    <section class="card">
      <div class="label">URL</div>

      <div class="urlbar">
        <input id="input" type="text" placeholder="Plak of schrijf een URL…" spellcheck="false">
      </div>

      <div class="actions">
        <!-- Downloadknop met download-icoon + afbeelding-icoon -->
        <button id="download" class="primary" disabled aria-label="Download afbeelding">
          <!-- download icoon -->
          <img class="btn-icon" alt=""
            src="data:image/svg+xml;utf8,
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'
                 stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
              <path d='M12 3v12'/>
              <path d='M7 10l5 5 5-5'/>
              <path d='M5 21h14'/>
            </svg>">
          <!-- afbeelding icoon -->
          <img class="btn-icon" alt=""
            src="data:image/svg+xml;utf8,
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'
                 stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
              <rect x='3' y='3' width='18' height='18' rx='2'/>
              <circle cx='8.5' cy='8.5' r='1.5'/>
              <path d='M21 15l-5-5L5 21'/>
            </svg>">
        </button>

        <button id="clear" disabled>Wis</button>
      </div>
    </section>

    <aside class="card">
      <div class="label">QR</div>
      <div class="preview">
        <canvas id="canvas" width="320" height="320"></canvas>
      </div>
    </aside>
  </div>
</main>

<footer>
  Zie eerst wat er is. Pas daarna wat je denkt te zien.
</footer>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  const input = document.getElementById("input");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d",{alpha:false});
  const btnDownload = document.getElementById("download");
  const btnClear = document.getElementById("clear");

  const SIZE = 320;
  const MARGIN = 2;
  const EC = "M";
  const FG = "#10b981";
  const BG = "#ffffff";

  function blank(){
    canvas.width = SIZE;
    canvas.height = SIZE;
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,SIZE,SIZE);
    btnDownload.disabled = true;
    btnClear.disabled = true;
  }

  function draw(value){
    value = value.trim();
    if(!value){ blank(); return; }

    const qr = qrcode(0,EC);
    qr.addData(value);
    qr.make();

    const m = qr.getModuleCount();
    const total = m + MARGIN*2;
    const scale = Math.floor(SIZE / total);
    const real = scale * total;

    canvas.width = real;
    canvas.height = real;

    ctx.fillStyle = BG;
    ctx.fillRect(0,0,real,real);

    ctx.fillStyle = FG;
    for(let r=0;r<m;r++){
      for(let c=0;c<m;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect((c+MARGIN)*scale,(r+MARGIN)*scale,scale,scale);
        }
      }
    }

    btnDownload.disabled = false;
    btnClear.disabled = false;
  }

  function download(){
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "qr";
    a.click();
  }

  input.addEventListener("input",()=>draw(input.value));
  btnDownload.addEventListener("click",download);
  btnClear.addEventListener("click",()=>{ input.value=""; blank(); input.focus(); });

  blank();
</script>

</body>
</html>
