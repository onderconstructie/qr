    .back-link{

      left:2rem;

      align-items:center;
      gap:.4rem;

      color:var(--slate-400);
      text-decoration:none;

      gap:1rem;
    }

    .logo{ width:44px; height:44px; }

      font-weight:700;

    }

      font-size:.8rem;
      color:var(--slate-500);
    }

    main{
      max-width:960px;
      margin:0 auto;
      padding:2rem;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:2rem;
    }

    @media(max-width:900px){
      .layout{ grid-template-columns:minmax(0,1fr); }

      .back-link{ position:static; margin-bottom:.75rem; }
      header{ flex-direction:column; }
    }

    .card{

      border-radius:var(--radius);
      padding:1.5rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
    }

    .label{
      font-size:0.75rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--slate-400);
      font-weight:600;
    }

    .urlbar{
      display:flex;
      align-items:center;
      gap:.75rem;

      border-radius:999px;
      padding:.55rem .75rem;

    .urlbar:focus-within{
      border-color:var(--accent);
      background:var(--white);

    }

      border:none;
      outline:none;
      background:transparent;

      display:flex;
      gap:.75rem;
    }

      font-weight:600;
      color:var(--slate-700);
      display:flex;
      align-items:center;
      gap:.4rem;

      border-color:var(--accent);

    }

<script>
  const input = document.getElementById("input");

    canvas.height = real;

  /* oc-terug: kom je uit een andere tool, dan brengt de terugknop linksboven je daar terug ("← Prioriteren").
