<script src="/lib/qrcode-generator-1.4.4.js"></script>
<script>
  const input = document.getElementById("input");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d",{alpha:false});
  const btnDownload = document.getElementById("download");
  const btnClear = document.getElementById("clear");
  const btnPdf = document.getElementById("pdf");
  const titel = document.getElementById("titel");
  const cap = document.getElementById("cap");
  const empty = document.getElementById("empty");
  const titelTekst = () => titel.value.replace(/\s+/g, " ").trim();
  function toonTitel(){ const t = titelTekst(); cap.textContent = t; cap.hidden = !t || !current; }
  let current = null;   /* {qr, value} van de getoonde code */

  const SIZE = 320;
  const MARGIN = 4;      /* rustzone: 4 modules, de norm */
  const PRINT = 1024;    /* breedte van de printklare download */
  const EC = "M";
  /* Tekst als UTF-8 coderen: zo lezen gsm's ook é, ë en emoji correct (standaard neemt de bibliotheek 1 byte per teken) */
  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const encoded = document.getElementById("encoded");
  const EMPTY_TEXT = "Je scancode verschijnt hier";
  /* Een webadres zonder https:// ("asgaupaust.be/agenda") wordt een echte link, anders opent een camera-app het als gewone tekst */
  const DOMEIN = /^(?:www\.)?[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*\.[a-z]{2,}(?::\d{1,5})?(?:[\/?#]\S*)?$/i;
  function toCode(v){
    if (/^[a-z][a-z0-9+.-]*:/i.test(v) || /\s|@/.test(v)) return v;
    return DOMEIN.test(v) ? "https://" + v : v;
  }
  const FG = "#047857";
  const BG = "#ffffff";

  function blank(){
    canvas.width = SIZE;
    canvas.height = SIZE;
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,SIZE,SIZE);
    btnDownload.disabled = true;
    btnPdf.disabled = true;
    btnClear.disabled = true;
    canvas.hidden = true;
    empty.hidden = false;
    current = null;
    toonTitel();
    encoded.hidden = true;
    empty.textContent = EMPTY_TEXT;
    empty.classList.remove("fout");
  }

  function draw(value){
    value = value.trim();
    if(!value){ blank(); return; }

    const code = toCode(value);
    let qr;
    try {
      qr = qrcode(0,EC);
      qr.addData(code);
      qr.make();
    } catch(e) {
      /* Te veel tekst voor één scancode: geen oude code laten staan */
      blank();
      empty.textContent = "Deze tekst is te lang voor een scancode. Maak hem korter, of gebruik een kortere link.";
      empty.classList.add("fout");
      return;
    }

    const m = qr.getModuleCount();
    const total = m + MARGIN*2;
    const scale = Math.floor(SIZE / total);
    const real = scale * total;

    canvas.width = real;
    canvas.height = real;

    ctx.fillStyle = BG;
    ctx.fillRect(0,0,real,real);

    ctx.fillStyle = FG;
    for(let r=0;r<m;r++){
      for(let c=0;c<m;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect((c+MARGIN)*scale,(r+MARGIN)*scale,scale,scale);
        }
      }
    }

    btnDownload.disabled = false;
    btnPdf.disabled = false;
    btnClear.disabled = false;
    canvas.hidden = false;
    empty.hidden = true;
    current = { qr, value: code };
    toonTitel();
    encoded.hidden = code === value;
    if (code !== value) { encoded.innerHTML = "Wordt een link: <b></b>"; encoded.querySelector("b").textContent = code; }
  }

  /* Naam voor het bestand: de host van de link, anders de tekst zelf */
  function slug(value){
    let base = value;
    try { base = new URL(/^[a-z][a-z0-9+.-]*:/i.test(value) ? value : "https://" + value).hostname || value; } catch(e) {}
    base = base.replace(/^www\./, "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
               .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    return base || "link";
  }

  function today(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  /* Tekst over regels verdelen. Een woord dat niet past (een lange link) breekt per teken. */
  function regels(x, tekst, maxW){
    const uit = [];
    let lijn = "";
    for (const woord of tekst.split(/\s+/).filter(Boolean)) {
      const probeer = lijn ? lijn + " " + woord : woord;
      if (x.measureText(probeer).width <= maxW) { lijn = probeer; continue; }
      if (lijn) uit.push(lijn);
      lijn = "";
      for (const teken of woord) {
        if (lijn && x.measureText(lijn + teken).width > maxW) { uit.push(lijn); lijn = ""; }
        lijn += teken;
      }
    }
    if (lijn) uit.push(lijn);
    return uit;
  }
  /* Even lange regels (zoals text-wrap:balance) en hoogstens max regels, anders afgekapt met … */
  function zetRegels(x, tekst, maxW, max, gelijk){
    let r = regels(x, tekst, maxW);
    if (gelijk && r.length > 1 && r.length <= max) {
      for (let w = maxW * 0.97; w > maxW * 0.4; w -= maxW * 0.03) { const t = regels(x, tekst, w); if (t.length > r.length) break; r = t; }
    }
    if (r.length > max) {
      r = r.slice(0, max);
      let l = r[max - 1];
      while (l.length > 1 && x.measureText(l + "…").width > maxW) l = l.slice(0, -1);
      r[max - 1] = l.replace(/\s+$/, "") + "…";
    }
    return r;
  }
  const FONT = "'DM Sans', system-ui, sans-serif";
  async function lettersKlaar(){
    try { await Promise.all(["500", "700"].map(w => document.fonts.load(w + " 32px 'DM Sans'"))); } catch(e) {}
  }

  /* Printklare versie: 1024 px breed, donkergroen, met de titel erboven en de link klein eronder */
  function printCanvas(){
    const { qr, value } = current;
    const m = qr.getModuleCount();
    const total = m + MARGIN*2;
    const scale = Math.floor(PRINT / total);
    const side = scale * total;
    const off = Math.floor((PRINT - side) / 2);
    const fontPx = 28;
    const textH = Math.round(fontPx * 2.4);
    const c = document.createElement("canvas");
    const t = titelTekst();
    const titelPx = 52, titelLijn = Math.round(titelPx * 1.22);
    let titelRegels = [];
    if (t) { const m2 = c.getContext("2d"); m2.font = "700 " + titelPx + "px " + FONT; titelRegels = zetRegels(m2, t, PRINT - 2 * scale * MARGIN, 2, true); }
    const top = titelRegels.length ? 56 + titelRegels.length * titelLijn : 0;
    c.width = PRINT;
    c.height = top + PRINT + textH;
    const x = c.getContext("2d", { alpha:false });
    x.fillStyle = BG;
    x.fillRect(0, 0, c.width, c.height);
    if (titelRegels.length) {
      x.fillStyle = "#1e293b";
      x.font = "700 " + titelPx + "px " + FONT;
      x.textAlign = "center";
      x.textBaseline = "middle";
      titelRegels.forEach((l, i) => x.fillText(l, PRINT/2, 56 + i * titelLijn + titelLijn / 2));
      x.translate(0, top);
    }
    x.fillStyle = FG;
    for(let r=0;r<m;r++){
      for(let k=0;k<m;k++){
        if(qr.isDark(r,k)) x.fillRect(off+(k+MARGIN)*scale, off+(r+MARGIN)*scale, scale, scale);
      }
    }
    x.fillStyle = "#334155";
    x.font = "500 " + fontPx + "px 'DM Sans', system-ui, sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    let label = value.replace(/^https?:\/\//i, "");
    const maxW = PRINT - 2 * scale * MARGIN;
    if (x.measureText(label).width > maxW) {
      while (label.length > 1 && x.measureText(label + "…").width > maxW) label = label.slice(0, -1);
      label += "…";
    }
    x.fillText(label, PRINT/2, PRINT + fontPx * 0.4);
    return c;
  }

  function bewaarBestand(blob, naam){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = naam;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  async function download(){
    if(!current) return;
    await lettersKlaar();
    const naam = "scancode-" + slug(current.value) + "-" + today() + ".png";
    printCanvas().toBlob(b => { if (!b) { toast("Downloaden lukt nu niet"); return; } bewaarBestand(b, naam); toast("Afbeelding gedownload"); }, "image/png");
  }

  /* ---------- Download als PDF: een rustig A4 om af te drukken, als affiche of tafelkaartje ----------
     jsPDF komt van hetzelfde adres als bij ocExport in de andere tools (/lib/), zodat de app het
     offline kan bewaren. Het wordt pas geladen bij de eerste PDF. De code zelf is vector: scherp op elk formaat. */
  const ocPdf = (() => {
    const LIB = "/lib/jspdf-2.5.1.umd.min.js";
    let laden = null;
    function load(){
      if (window.jspdf) return Promise.resolve();
      if (!laden) laden = new Promise((ok, fail) => {
        const s = document.createElement("script");
        s.src = LIB; s.onload = ok;
        s.onerror = () => { laden = null; s.remove(); fail(new Error("laden mislukt")); };
        document.head.appendChild(s);
      });
      return laden;
    }
    return { load };
  })();

  const PX = 12;                 /* pixels per mm voor de tekst in de PDF (ongeveer 300 dpi) */
  const PT = 0.3528;             /* 1 punt in mm */
  /* Een tekstblok als scherpe afbeelding, gecentreerd, in DM Sans */
  function tekstBlok({ tekst, gewicht, pt, kleur, breedte, max, lijn, gelijk }){
    const c = document.createElement("canvas");
    const x = c.getContext("2d");
    const px = pt * PT * PX, maxW = breedte * PX;
    const font = gewicht + " " + px + "px " + FONT;
    x.font = font;
    const r = zetRegels(x, tekst, maxW, max, gelijk);
    const lh = px * lijn;
    c.width = Math.ceil(maxW);
    c.height = Math.ceil(r.length * lh + px * 0.3);
    x.font = font;   /* doorzichtige achtergrond: zuiver wit op papier */ x.fillStyle = kleur; x.textAlign = "center"; x.textBaseline = "middle";
    r.forEach((l, i) => x.fillText(l, c.width / 2, px * 0.15 + i * lh + lh / 2));
    return { url: c.toDataURL("image/png"), w: breedte, h: c.height / PX, regels: r.length };
  }

  async function downloadPdf(){
    if(!current) return;
    const nu = current;
    toast("Bezig…");
    try { await ocPdf.load(); }
    catch(e) { toast("Downloaden lukt nu niet: geen verbinding?"); return; }
    await lettersKlaar();
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4", compress:true });
      const W = 210, H = 297, Q = 120;      /* A4, de code zelf 12 cm breed */
      const t = titelTekst();
      let kop = null;
      if (t) {
        kop = tekstBlok({ tekst:t, gewicht:700, pt:30, kleur:"#1e293b", breedte:160, max:2, lijn:1.2, gelijk:true });
        if (kop.regels > 1) kop = tekstBlok({ tekst:t, gewicht:700, pt:26, kleur:"#1e293b", breedte:160, max:2, lijn:1.2, gelijk:true });
      }
      const link = tekstBlok({ tekst:nu.value.replace(/^https?:\/\//i, "").replace(/\/$/, ""), gewicht:500, pt:11, kleur:"#475569", breedte:150, max:3, lijn:1.35 });
      const gapKop = 16, gapLink = 10;
      const hoog = (kop ? kop.h + gapKop : 0) + Q + gapLink + link.h;
      let y = Math.max(28, (H - hoog) / 2 - 8);   /* iets boven het midden: dat oogt rustiger */
      if (kop) { doc.addImage(kop.url, "PNG", (W - kop.w) / 2, y, kop.w, kop.h); y += kop.h + gapKop; }
      /* Code als vlakjes: per rij aaneengesloten stukken, met een haarfijne overlap tegen witte naadjes */
      const m = nu.qr.getModuleCount(), mod = Q / m, x0 = (W - Q) / 2, y0 = y;
      doc.setFillColor(4, 120, 87);
      for (let r = 0; r < m; r++) {
        for (let k = 0; k < m; k++) {
          if (!nu.qr.isDark(r, k)) continue;
          let e = k; while (e + 1 < m && nu.qr.isDark(r, e + 1)) e++;
          doc.rect(x0 + k * mod, y0 + r * mod, (e - k + 1) * mod, mod + 0.03, "F");
          k = e;
        }
      }
      y += Q + gapLink;
      doc.addImage(link.url, "PNG", (W - link.w) / 2, y, link.w, link.h);
      doc.setProperties({ title: t || "Scancode", subject: nu.value, creator: "Onder Constructie" });
      bewaarBestand(doc.output("blob"), "scancode-" + slug(nu.value) + "-" + today() + ".pdf");
      toast("PDF gedownload");
    } catch(e) { toast("Downloaden lukt nu niet"); }
  }

  let toastT = null;
  function toast(msg){
    document.getElementById("toast-text").textContent = msg;
    document.getElementById("toast").classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => document.getElementById("toast").classList.remove("show"), 2600);
  }

  /* Tekenen hoogstens één keer per frame: plakken of snel typen blijft vlot */
  let drawFrame = 0;
  input.addEventListener("input",()=>{ cancelAnimationFrame(drawFrame); drawFrame = requestAnimationFrame(()=>draw(input.value)); });
  /* Enter: toetsenbord dicht en de scancode in beeld (op een gsm staat ze onder het veld) */
  input.addEventListener("keydown",e=>{ if(e.key!=="Enter") return; e.preventDefault(); cancelAnimationFrame(drawFrame); draw(input.value); input.blur(); if(!canvas.hidden) canvas.scrollIntoView({block:"nearest",behavior:"smooth"}); });
  btnDownload.addEventListener("click",download);
  btnPdf.addEventListener("click",downloadPdf);
  btnClear.addEventListener("click",()=>{ input.value=""; titel.value=""; blank(); input.focus(); });
  titel.addEventListener("input", toonTitel);
  titel.addEventListener("keydown", e => { if (e.key !== "Enter") return; e.preventDefault(); titel.blur(); });
  /* Soepel: jsPDF alvast ophalen zodra iemand naar de PDF-knop gaat (niet bij het laden) */
  (() => {
    let warm = false;
    const go = () => {
      warm = true;
      const h = "/lib/jspdf-2.5.1.umd.min.js", l = document.createElement("link");
      if (l.relList && l.relList.supports && l.relList.supports("prefetch")) { l.rel = "prefetch"; l.as = "script"; l.href = h; document.head.appendChild(l); }
      else try { fetch(h).catch(() => {}); } catch (e) {}
    };
    ["pointerdown", "focusin", "mouseover"].forEach(t => btnPdf.addEventListener(t, () => { if (!warm) go(); }, { passive:true }));
  })();

  blank();
</script>

<script>
/* oc-sync: reageert op "Wissen" in de app (ook in andere tabbladen) en geeft Esc door aan de app */
(function () {
  if (window.__ocSync) return; window.__ocSync = true;
  var gewist = false;
  function wis() {
    if (gewist) return; gewist = true;
    try { var orig = Storage.prototype.setItem; Storage.prototype.setItem = function (k, v) { if (k === 'oc.wis') return orig.call(this, k, v); }; } catch (e) {}
    try { document.body.innerHTML = '<p role="status" style="font-family:\'DM Sans\',system-ui,sans-serif;padding:3rem 1.5rem;text-align:center;color:#475569;font-size:1.0625rem">Er is iets veranderd op dit toestel. Deze pagina laadt opnieuw…</p>'; } catch (e) {}
    setTimeout(function () { location.reload(); }, 400);
  }
  try { var bc = new BroadcastChannel('oc-sync'); bc.onmessage = function (e) { if (e.data && e.data.type === 'wis') wis(); }; } catch (e) {}
  addEventListener('storage', function (e) { if (e.key === 'oc.wis' || e.key === null) wis(); });
  if (window.parent === window) return;
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    var a = document.activeElement;
    if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    if (document.querySelector('dialog[open], [role="dialog"]:not([hidden]):not([aria-hidden="true"]), [aria-modal="true"]:not([hidden]), [aria-expanded="true"], .open, .show, .active.modal, .is-open')) return;
    try { parent.postMessage({ type: 'oc-esc' }, location.origin); } catch (err) {}
  }, true);
})();
</script>
