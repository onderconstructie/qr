  <style>

      --slate-200:#e2e8f0;

      justify-content:center;

    .back-link{

      align-items:center;

      font-size:.85rem;
      color:var(--slate-400);
      text-decoration:none;

    .back-link:hover{ color:var(--accent); }

        /* Onder Constructie: gedeelde footer en quote (huisstijl) */

<body>

<header class="header oc-head">
        <a href="../zakmes/" class="back-link" aria-label="Terug naar Zakmes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

<main>
  <div class="layout">
    <section class="card">
      <label class="label" for="input">Link</label>

      <div class="urlbar">
        <input id="input" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="done" placeholder="Plak of schrijf een link…" spellcheck="false">
      </div>

      <div class="actions">
        <!-- Downloadknop met download-icoon + afbeelding-icoon -->
        <button id="download" class="primary" type="button" disabled aria-label="Download de scancode als afbeelding">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Download
        </button>

        <button id="clear" type="button" disabled>Wis</button>
      </div>
    </section>

    <aside class="card">
      <div class="label">Scancode</div>

        <p class="empty" id="empty">Je scancode verschijnt hier</p>

      </div>
    </aside>
  </div>
</main>

<footer class="footer oc-footer">
        <p class="quote oc-quote">Zie eerst wat er is. Pas daarna wat je denkt te zien.</p>
    </footer>

<script src="/lib/qrcode-generator-1.4.4.js"></script>
<script>
  const input = document.getElementById("input");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d",{alpha:false});
  const btnDownload = document.getElementById("download");
  const btnClear = document.getElementById("clear");
  const empty = document.getElementById("empty");
  let current = null;   /* {qr, value} van de getoonde code */

  const SIZE = 320;
  const MARGIN = 4;      /* rustzone: 4 modules, de norm */
  const PRINT = 1024;    /* breedte van de printklare download */
  const EC = "M";
  const FG = "#047857";
  const BG = "#ffffff";

  function blank(){
    canvas.width = SIZE;
    canvas.height = SIZE;
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,SIZE,SIZE);
    btnDownload.disabled = true;
    btnClear.disabled = true;
    canvas.hidden = true;
    empty.hidden = false;
    current = null;
  }

  function draw(value){
    value = value.trim();
    if(!value){ blank(); return; }

    const qr = qrcode(0,EC);
    qr.addData(value);
    qr.make();

    const m = qr.getModuleCount();
    const total = m + MARGIN*2;
    const scale = Math.floor(SIZE / total);
    const real = scale * total;

    canvas.width = real;
    canvas.height = real;

    ctx.fillStyle = BG;
    ctx.fillRect(0,0,real,real);

    ctx.fillStyle = FG;
    for(let r=0;r<m;r++){
      for(let c=0;c<m;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect((c+MARGIN)*scale,(r+MARGIN)*scale,scale,scale);
        }
      }
    }

    btnDownload.disabled = false;
    btnClear.disabled = false;
    canvas.hidden = false;
    empty.hidden = true;
    current = { qr, value };
  }

  /* Naam voor het bestand: de host van de link, anders de tekst zelf */
  function slug(value){
    let base = value;
    try { base = new URL(/^[a-z][a-z0-9+.-]*:/i.test(value) ? value : "https://" + value).hostname || value; } catch(e) {}
    base = base.replace(/^www\./, "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
               .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    return base || "link";
  }

  function today(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  /* Printklare versie: 1024 px breed, donkergroen, met de link klein eronder */
  function printCanvas(){
    const { qr, value } = current;
    const m = qr.getModuleCount();
    const total = m + MARGIN*2;
    const scale = Math.floor(PRINT / total);
    const side = scale * total;
    const off = Math.floor((PRINT - side) / 2);
    const fontPx = 28;
    const textH = Math.round(fontPx * 2.4);
    const c = document.createElement("canvas");
    c.width = PRINT;
    c.height = PRINT + textH;
    const x = c.getContext("2d", { alpha:false });
    x.fillStyle = BG;
    x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = FG;
    for(let r=0;r<m;r++){
      for(let k=0;k<m;k++){
        if(qr.isDark(r,k)) x.fillRect(off+(k+MARGIN)*scale, off+(r+MARGIN)*scale, scale, scale);
      }
    }
    x.fillStyle = "#334155";
    x.font = "500 " + fontPx + "px 'DM Sans', system-ui, sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    let label = value.replace(/^https?:\/\//i, "");
    const maxW = PRINT - 2 * scale * MARGIN;
    if (x.measureText(label).width > maxW) {
      while (label.length > 1 && x.measureText(label + "…").width > maxW) label = label.slice(0, -1);
      label += "…";
    }
    x.fillText(label, PRINT/2, PRINT + fontPx * 0.4);
    return c;
  }

  function download(){
    if(!current) return;
    const a = document.createElement("a");
    a.href = printCanvas().toDataURL("image/png");
    a.download = "scancode-" + slug(current.value) + "-" + today() + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* Tekenen hoogstens één keer per frame: plakken of snel typen blijft vlot */
  let drawFrame = 0;
  input.addEventListener("input",()=>{ cancelAnimationFrame(drawFrame); drawFrame = requestAnimationFrame(()=>draw(input.value)); });
  /* Enter: toetsenbord dicht en de scancode in beeld (op een gsm staat ze onder het veld) */
  input.addEventListener("keydown",e=>{ if(e.key!=="Enter") return; e.preventDefault(); cancelAnimationFrame(drawFrame); draw(input.value); input.blur(); if(!canvas.hidden) canvas.scrollIntoView({block:"nearest",behavior:"smooth"}); });
  btnDownload.addEventListener("click",download);
  btnClear.addEventListener("click",()=>{ input.value=""; blank(); input.focus(); });

  blank();
</script>

<script>
/* oc-sync: reageert op "Afsluiten" in de app (ook in andere tabbladen) en geeft Esc door aan de app */
(function () {
  if (window.__ocSync) return; window.__ocSync = true;
  var gewist = false;
  function wis() {
    if (gewist) return; gewist = true;
    try { var orig = Storage.prototype.setItem; Storage.prototype.setItem = function (k, v) { if (k === 'oc.wis') return orig.call(this, k, v); }; } catch (e) {}
    try { document.body.innerHTML = '<p role="status" style="font-family:\'DM Sans\',system-ui,sans-serif;padding:3rem 1.5rem;text-align:center;color:#475569;font-size:1.0625rem">Alles is gewist op dit toestel. Deze pagina laadt opnieuw…</p>'; } catch (e) {}
    setTimeout(function () { location.reload(); }, 400);
  }
  try { var bc = new BroadcastChannel('oc-sync'); bc.onmessage = function (e) { if (e.data && e.data.type === 'wis') wis(); }; } catch (e) {}
  addEventListener('storage', function (e) { if (e.key === 'oc.wis' || e.key === null) wis(); });
  if (window.parent === window) return;
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    var a = document.activeElement;
    if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    if (document.querySelector('dialog[open], [role="dialog"]:not([hidden]):not([aria-hidden="true"]), [aria-modal="true"]:not([hidden]), [aria-expanded="true"], .open, .show, .active.modal, .is-open')) return;
    try { parent.postMessage({ type: 'oc-esc' }, location.origin); } catch (err) {}
  }, true);
})();
</script>
