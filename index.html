<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#ffffff">
  <title>QR Generator – Onder Constructie</title>
    <meta name="description" content="Plak een URL, krijg direct een QR-code. Simpel en snel.">
    <meta name="oc:groep" content="zakmes">
    <meta name="oc:labels" content="delen">
    <meta name="oc:kort" content="Maak een QR-code van een link">
    <meta name="oc:volgorde" content="110">
<link rel="stylesheet" href="/fonts/fonts.css">

  <!-- App favicon: hetzelfde logo als in de header -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;16&quot; fill=&quot;%23f0fdf4&quot; stroke=&quot;%2310b981&quot; stroke-width=&quot;2&quot;/%3E %3Cg fill=&quot;%2310b981&quot;%3E %3Crect x=&quot;12&quot; y=&quot;12&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.4&quot;/%3E %3Crect x=&quot;21&quot; y=&quot;12&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.4&quot;/%3E %3Crect x=&quot;12&quot; y=&quot;21&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.4&quot;/%3E %3Crect x=&quot;21&quot; y=&quot;21&quot; width=&quot;2.4&quot; height=&quot;2.4&quot; rx=&quot;.4&quot;/%3E %3Crect x=&quot;24.4&quot; y=&quot;21&quot; width=&quot;2.4&quot; height=&quot;2.4&quot; rx=&quot;.4&quot;/%3E %3Crect x=&quot;21&quot; y=&quot;24.4&quot; width=&quot;2.4&quot; height=&quot;2.4&quot; rx=&quot;.4&quot;/%3E %3Crect x=&quot;26.8&quot; y=&quot;24.4&quot; width=&quot;2.4&quot; height=&quot;2.4&quot; rx=&quot;.4&quot;/%3E %3Crect x=&quot;23.4&quot; y=&quot;26.8&quot; width=&quot;2.4&quot; height=&quot;2.4&quot; rx=&quot;.4&quot;/%3E %3C/g%3E %3C/svg%3E">

  <style>
    :root{
      --slate-50:#f8fafc;
      --slate-200:#e2e8f0;
      --slate-400:#94a3b8;
      --slate-500:#64748b;
      --slate-700:#334155;
      --slate-800:#1e293b;
      --slate-900:#0f172a;
      --white:#ffffff;
      --accent:#10b981;
      --accent-soft:#f0fdf4;
      --radius:16px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family:'DM Sans', system-ui, -apple-system, sans-serif;
      background:var(--slate-50);
      color:var(--slate-700);
      min-height:100vh;
    }

    header{
      background:var(--white);
      border-bottom:1px solid var(--slate-200);
      padding:1.25rem 2rem;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .back-link{
      position:absolute;
      left:2rem;
      display:flex;
      align-items:center;
      gap:.4rem;
      font-size:.85rem;
      color:var(--slate-400);
      text-decoration:none;
    }
    .back-link:hover{ color:var(--accent); }

    .header-inner{
      display:flex;
      align-items:center;
      gap:1rem;
    }

    .logo{ width:44px; height:44px; }

    h1{
      font-size:1.25rem;
      font-weight:700;
      color:var(--slate-800);
      letter-spacing:-0.02em;
    }

    .subtitle{
      font-size:.8rem;
      color:var(--slate-500);
    }

    main{
      max-width:960px;
      margin:0 auto;
      padding:2rem;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:2rem;
    }

    @media(max-width:900px){
      .layout{ grid-template-columns:minmax(0,1fr); }
      main{ padding:1.25rem 1rem; }
      .back-link{ position:static; margin-bottom:.75rem; }
      header{ flex-direction:column; }
    }

    .card{
      min-width:0;
      background:var(--white);
      border:1.5px solid var(--slate-200);
      border-radius:var(--radius);
      padding:1.5rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
    }

    .label{
      font-size:0.6875rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--slate-400);
      font-weight:600;
    }

    .urlbar{
      display:flex;
      align-items:center;
      gap:.75rem;
      border:1.5px solid var(--slate-200);
      background:var(--slate-50);
      border-radius:999px;
      padding:.55rem .75rem;
    }

    .urlbar:focus-within{
      border-color:var(--accent);
      background:var(--white);
      box-shadow:0 0 0 4px rgba(16,185,129,.12);
    }

    .urlbar input{
      border:none;
      outline:none;
      background:transparent;
      width:100%;
      font-size:.95rem;
      color:var(--slate-900);
    }

    .actions{
      display:flex;
      gap:.75rem;
    }

    button{
      appearance:none;
      border:1.5px solid var(--slate-200);
      background:var(--white);
      border-radius:999px;
      padding:.55rem .85rem;
      font-size:.85rem;
      font-weight:600;
      color:var(--slate-700);
      display:flex;
      align-items:center;
      gap:.4rem;
      cursor:pointer;
    }

    button.primary{
      background:var(--accent-soft);
      border-color:var(--accent);
      color:#047857;
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .btn-icon{
      width:16px;
      height:16px;
      display:block;
    }

    .preview{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1.5px solid var(--slate-200);
      border-radius:var(--radius);
      background:var(--white);
    }

    canvas{ image-rendering:pixelated; }

    footer{
      text-align:center;
      padding:2rem;
      font-size:.8rem;
      color:var(--accent);
      font-weight:400;
    }
  
        /* Onder Constructie: gedeelde footer en quote (huisstijl) */
        footer.oc-footer {
            text-align: center;
            padding: 2rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
            margin-top: 2rem;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            color: #10b981;
        }

        footer.oc-footer .oc-quote {
            font-size: 0.8125rem;
            line-height: 1.5;
            color: #10b981;
            opacity: 1;
            font-style: normal;
            margin: 0;
        }
    
        /* ===== Huisstijl oktober 2026: kop (patroon B), contrast, focus, tikdoelen ===== */
        .oc-head { display:block; text-align:center; background:#fff; border-bottom:1px solid #e2e8f0; padding:1.5rem 1.25rem 1.75rem; position:relative; }
        .oc-head .back-link { position:absolute; top:0.875rem; left:1rem; min-height:44px; display:inline-flex; align-items:center; gap:0.5rem; padding:0 0.5rem; margin:0; font-size:0.875rem; color:#64748b; text-decoration:none; border-radius:8px; transition:color 0.2s; }
        .oc-head .back-link:hover { color:#047857; }
        .oc-head .back-link svg { width:16px; height:16px; flex:none; }
        .oc-head .logo { display:block; width:56px; height:56px; margin:0 auto; }
        .oc-head .logo svg { display:block; width:56px; height:56px; }
        .oc-head .title { font-size:1.625rem; font-weight:700; color:#1e293b; letter-spacing:-0.03em; line-height:1.2; margin:0.5rem 0 0.25rem; }
        .oc-head .subtitle { font-size:0.9375rem; color:#64748b; max-width:520px; margin:0 auto; }
        @media (max-width:640px) {
            .oc-head { padding-top:0.5rem; }
            .oc-head .back-link { position:static; margin:0 auto 0.375rem; }
        }
        footer.oc-footer, footer.oc-footer .oc-quote, .footer .quote { color:#047857; }
        :focus-visible { outline:2px solid #047857 !important; outline-offset:2px; }
        input[type=range]:focus-visible { outline:2px solid #047857 !important; outline-offset:4px; }
        .oc-import { color:#047857; min-height:44px; }
        .oc-import:focus-visible { outline-color:#047857; }
        .sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

        .label { color:#64748b; display:block; }
        .actions button { min-height:44px; border-radius:10px; padding:0 1rem; font-size:0.875rem; }
        button.primary { background:#047857; border-color:#047857; color:#fff; font-size:15px; }
        button.primary:hover:not(:disabled) { background:#065f46; border-color:#065f46; }
        button.primary svg { width:18px; height:18px; }
        .urlbar { padding:0.25rem 0.75rem; }
        .urlbar input { min-height:40px; }
        .urlbar input::placeholder { color:#64748b; }
        .urlbar input:focus-visible { outline:none !important; }
        .urlbar:focus-within { border-color:#047857; box-shadow:0 0 0 3px rgba(4,120,87,0.25); }
        #canvas { max-width:100%; height:auto; }
    </style>
</head>
<body>

<header class="header oc-head">
        <a href="https://onderconstructie.github.io/zakmes/" class="back-link" aria-label="Terug naar Zakmes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Zakmes
        </a>
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
        <g fill="#10b981">
          <rect x="12" y="12" width="7" height="7" rx="1.4"/>
          <rect x="21" y="12" width="7" height="7" rx="1.4"/>
          <rect x="12" y="21" width="7" height="7" rx="1.4"/>
          <rect x="21" y="21" width="2.4" height="2.4" rx=".4"/>
          <rect x="24.4" y="21" width="2.4" height="2.4" rx=".4"/>
          <rect x="21" y="24.4" width="2.4" height="2.4" rx=".4"/>
          <rect x="26.8" y="24.4" width="2.4" height="2.4" rx=".4"/>
          <rect x="23.4" y="26.8" width="2.4" height="2.4" rx=".4"/>
        </g>
      </svg>
        </div>
        <h1 class="title">QR Generator</h1>
        <p class="subtitle">Plak, scan, klaar.</p>
    </header>

<main>
  <div class="layout">
    <section class="card">
      <label class="label" for="input">URL</label>

      <div class="urlbar">
        <input id="input" type="text" placeholder="Plak of schrijf een URL…" spellcheck="false">
      </div>

      <div class="actions">
        <!-- Downloadknop met download-icoon + afbeelding-icoon -->
        <button id="download" class="primary" type="button" disabled aria-label="Download de QR-code als afbeelding">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Download
        </button>

        <button id="clear" type="button" disabled>Wis</button>
      </div>
    </section>

    <aside class="card">
      <div class="label">QR</div>
      <div class="preview">
        <canvas id="canvas" width="320" height="320" role="img" aria-label="QR-code"></canvas>
      </div>
    </aside>
  </div>
</main>

<footer class="footer oc-footer">
        <p class="quote oc-quote">Zie eerst wat er is. Pas daarna wat je denkt te zien.</p>
    </footer>

<script src="/lib/qrcode-generator-1.4.4.js"></script>
<script>
  const input = document.getElementById("input");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d",{alpha:false});
  const btnDownload = document.getElementById("download");
  const btnClear = document.getElementById("clear");

  const SIZE = 320;
  const MARGIN = 2;
  const EC = "M";
  const FG = "#10b981";
  const BG = "#ffffff";

  function blank(){
    canvas.width = SIZE;
    canvas.height = SIZE;
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,SIZE,SIZE);
    btnDownload.disabled = true;
    btnClear.disabled = true;
  }

  function draw(value){
    value = value.trim();
    if(!value){ blank(); return; }

    const qr = qrcode(0,EC);
    qr.addData(value);
    qr.make();

    const m = qr.getModuleCount();
    const total = m + MARGIN*2;
    const scale = Math.floor(SIZE / total);
    const real = scale * total;

    canvas.width = real;
    canvas.height = real;

    ctx.fillStyle = BG;
    ctx.fillRect(0,0,real,real);

    ctx.fillStyle = FG;
    for(let r=0;r<m;r++){
      for(let c=0;c<m;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect((c+MARGIN)*scale,(r+MARGIN)*scale,scale,scale);
        }
      }
    }

    btnDownload.disabled = false;
    btnClear.disabled = false;
  }

  function download(){
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "qr";
    a.click();
  }

  input.addEventListener("input",()=>draw(input.value));
  btnDownload.addEventListener("click",download);
  btnClear.addEventListener("click",()=>{ input.value=""; blank(); input.focus(); });

  blank();
</script>

</body>
</html>
